<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-name" content="dmx-suite">
<meta name="dmx-token" content="__TOKEN__">
<meta name="theme-color" content="#08080b">
<title>__APP_NAME__</title>
<link rel="icon" href="/static/brand/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/themes/__THEME__/theme.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <img src="/static/themes/__THEME__/logo.svg" alt="" class="logo">
  <div class="now" id="now" data-i18n="status.connecting"></div>
  <div class="tempo" id="tempo" data-i18n-title="top.tempo_tip"><span class="beat-dot"></span><span id="tempo-text"></span></div>
  <button id="master" class="toggle master" data-i18n="top.master"></button>
  <button id="blackout" class="toggle danger" data-i18n="top.blackout"></button>
  <button class="lock" id="giglock" data-i18n="top.giglock" data-i18n-title="top.giglock_tip"></button>
</header>
<div class="health" id="health" data-i18n-title="top.health_tip"></div>
<div class="banner hidden" id="banner" role="alert"></div>

<div class="shell">
  <nav class="menu" id="menu" aria-label="Pages">
    <button class="collapse" id="collapse" data-i18n-title="menu.collapse"><span class="ic">☰</span></button>
    <button data-page="live" class="on"><span class="ic">◉</span><span class="lbl" data-i18n="menu.live"></span></button>
    <button data-page="layout"><span class="ic">▦</span><span class="lbl" data-i18n="menu.layout"></span></button>
    <button data-page="scenes"><span class="ic">◆</span><span class="lbl" data-i18n="menu.scenes"></span></button>
    <button data-page="heads"><span class="ic">✥</span><span class="lbl" data-i18n="menu.heads"></span></button>
    <button data-page="midi"><span class="ic">♪</span><span class="lbl" data-i18n="menu.midi"></span></button>
    <button data-page="setup"><span class="ic">⚙</span><span class="lbl" data-i18n="menu.setup"></span></button>
    <button data-page="files"><span class="ic">▤</span><span class="lbl" data-i18n="menu.files"></span></button>
  </nav>

  <main>
    <!-- LIVE -->
    <section id="page-live" class="page on">
      <div class="grid-host live" id="live-grid"></div>
      <h2 data-i18n="live.show"></h2>
      <div class="row wrap" id="shows"></div>
      <div class="row wrap" id="sets"></div>
      <div class="row wrap">
        <button data-cmd="next" data-i18n="live.next"></button>
        <button data-cmd="look" data-i18n="live.static_look"></button>
        <button id="tap" data-i18n="live.tap"></button>
        <input id="bpm" type="number" min="40" max="240" step="1" class="narrow" data-i18n-placeholder="live.bpm_placeholder">
        <button id="bpm-set" data-i18n="live.bpm_set"></button>
        <button data-cmd="tempo" data-bpm="off" data-i18n="live.tempo_off"></button>
        <span class="muted" id="preview"></span>
      </div>
      <h2 data-i18n="live.setlist"></h2>
      <div class="row wrap">
        <select id="setlist"></select>
        <button id="setlist-go" data-i18n="live.start"></button>
        <button data-cmd="song" data-song="prev" data-i18n="live.prev_song"></button>
        <button data-cmd="song" data-song="next" data-i18n="live.next_song"></button>
      </div>
      <ol class="songs" id="songs"></ol>
      <h2 data-i18n="live.masters"></h2>
      <div class="faders" id="faders"></div>
      <h2 data-i18n="live.haze"></h2>
      <div class="row wrap">
        <button data-haze="off" data-i18n="haze.off"></button>
        <button data-haze="manual" data-i18n="haze.manual"></button>
        <button data-haze="pulse" data-i18n="haze.pulse"></button>
        <button id="boost" class="hold" data-i18n="haze.boost"></button>
      </div>
      <div class="muted" id="haze"></div>
    </section>

    <!-- LAYOUT -->
    <section id="page-layout" class="page">
      <div class="tabs" id="group-tabs" role="tablist"></div>
      <div class="toolbar">
        <div class="tools" role="group">
          <button data-tool="select" class="sel" data-i18n-title="layout.tool_select_tip"><span data-i18n="layout.tool_select"></span></button>
          <button data-tool="lasso" data-i18n-title="layout.tool_lasso_tip"><span data-i18n="layout.tool_lasso"></span></button>
          <button data-tool="move" data-i18n-title="layout.tool_move_tip"><span data-i18n="layout.tool_move"></span></button>
        </div>
        <label class="zoom"><span data-i18n="layout.zoom"></span><input type="range" id="zoom" min="50" max="300" step="10" value="100"></label>
        <label class="check"><input type="checkbox" id="show-names" checked><span data-i18n="layout.names"></span></label>
        <label class="check"><input type="checkbox" id="show-beams"><span data-i18n="layout.beams"></span></label>
      </div>
      <div class="grid-host edit" id="layout-grid"></div>
      <div class="muted" id="layout-sel"></div>

      <h2 data-i18n="layout.arrange"></h2>
      <div class="row wrap" id="arrange-tools">
        <button data-align="left" data-i18n="layout.align_left"></button>
        <button data-align="hcentre" data-i18n="layout.align_hcentre"></button>
        <button data-align="right" data-i18n="layout.align_right"></button>
        <button data-align="top" data-i18n="layout.align_top"></button>
        <button data-align="vcentre" data-i18n="layout.align_vcentre"></button>
        <button data-align="bottom" data-i18n="layout.align_bottom"></button>
        <button data-distribute="h" data-i18n="layout.distribute_h"></button>
        <button data-distribute="v" data-i18n="layout.distribute_v"></button>
      </div>
      <div class="row wrap">
        <button data-make="row" data-i18n="layout.make_row"></button>
        <button data-make="ring" data-i18n="layout.make_ring"></button>
        <button data-make="grid" data-i18n="layout.make_grid"></button>
        <button data-rotate="-45" data-i18n="layout.rotate_l"></button>
        <button data-rotate="45" data-i18n="layout.rotate_r"></button>
        <span class="muted" data-i18n="layout.pixels"></span>
        <button data-shape="row" data-i18n="layout.shape_row"></button>
        <button data-shape="ring" data-i18n="layout.shape_ring"></button>
        <button data-shape="grid" data-i18n="layout.shape_grid"></button>
      </div>
      <div class="row wrap">
        <button id="layout-save" data-i18n="layout.save"></button>
        <button id="layout-undo" data-i18n="layout.undo"></button>
        <button id="layout-reset" data-i18n="layout.reset"></button>
      </div>

      <h2 data-i18n="groups.title"></h2>
      <div class="row wrap">
        <input id="group-name" maxlength="40" data-i18n-placeholder="groups.name_placeholder">
        <button id="group-new" data-i18n="groups.new"></button>
        <button id="group-set" data-i18n="groups.set"></button>
        <button id="group-rename" data-i18n="groups.rename"></button>
        <button id="group-delete" class="danger-text" data-i18n="groups.delete"></button>
      </div>
      <p class="muted" data-i18n="groups.help"></p>
    </section>

    <!-- SCENES -->
    <section id="page-scenes" class="page">
      <div class="row wrap scene-bar">
        <select id="scene-pick" data-i18n-title="scenes.pick"></select>
        <button id="scene-new" data-i18n="scenes.new"></button>
        <button id="scene-dup" data-i18n="scenes.duplicate"></button>
        <button id="scene-del" class="danger-text" data-i18n="scenes.delete"></button>
        <input id="scene-name" maxlength="60" data-i18n-placeholder="scenes.name_placeholder">
        <button id="scene-save" data-i18n="scenes.save"></button>
        <span class="muted" id="scene-state"></span>
      </div>
      <div class="builder">
        <div class="builder-left">
          <div class="tabs" id="scene-group-tabs" role="tablist"></div>
          <div class="grid-host" id="scene-grid"></div>
          <div class="row wrap">
            <span class="muted" id="scene-sel"></span>
          </div>
          <div class="row wrap">
            <label class="check"><input type="checkbox" id="scene-preview"><span data-i18n="scenes.live_preview"></span></label>
            <span class="muted" id="scene-preview-note"></span>
          </div>
        </div>
        <div class="builder-right">
          <h2 data-i18n="scenes.layers"></h2>
          <ol class="layers" id="layers"></ol>
          <div class="row wrap">
            <button id="layer-add" data-i18n="scenes.add_layer"></button>
          </div>
          <div class="error hidden" id="scene-error" role="alert"></div>
          <h2 id="layer-title" data-i18n="scenes.layer"></h2>
          <div id="layer-form" class="form"></div>
          <details class="scene-more">
            <summary data-i18n="scenes.scene_settings"></summary>
            <div class="form">
              <label class="field"><span data-i18n="scenes.show_colour"></span><span id="scene-show-colour"></span></label>
              <label class="field"><span data-i18n="scenes.length"></span><input id="scene-length" type="number" min="0" step="0.5" class="narrow"></label>
            </div>
          </details>
        </div>
      </div>
    </section>

    <!-- HEADS -->
    <section id="page-heads" class="page">
      <p class="muted" data-i18n="heads.help"></p>
      <div class="heads" id="heads"></div>
      <div class="row wrap">
        <button data-cmd="release_positions" data-i18n="heads.release_all"></button>
        <input id="posname" maxlength="40" data-i18n-placeholder="heads.position_placeholder">
        <button id="savepos" data-i18n="heads.save_position"></button>
      </div>
      <div class="row wrap" id="positions"></div>
    </section>

    <!-- MIDI -->
    <section id="page-midi" class="page">
      <div class="row wrap">
        <button id="midi-pause" data-i18n="midi.pause"></button>
        <button id="midi-clear" data-i18n="midi.clear"></button>
        <select id="midi-filter"></select>
      </div>
      <table class="monitor"><thead><tr>
        <th data-i18n="midi.col_time"></th><th data-i18n="midi.col_port"></th><th data-i18n="midi.col_ch"></th>
        <th data-i18n="midi.col_type"></th><th>#</th><th data-i18n="midi.col_value"></th><th data-i18n="midi.col_triggered"></th>
      </tr></thead><tbody id="monitor"></tbody></table>
      <h2 data-i18n="midi.learn"></h2>
      <div class="row wrap">
        <select id="learn-action"></select>
        <input id="learn-params" data-i18n-placeholder="midi.params_placeholder">
        <button id="learn-go" data-i18n="midi.learn_go"></button>
        <button id="learn-cancel" data-i18n="midi.learn_cancel"></button>
        <span id="learn-state" class="muted"></span>
      </div>
      <h2 data-i18n="midi.mapping"></h2>
      <table class="map"><thead><tr>
        <th data-i18n="midi.col_input"></th><th data-i18n="midi.col_ch"></th><th>#</th><th data-i18n="midi.col_action"></th><th></th>
      </tr></thead><tbody id="map"></tbody></table>
      <button id="map-save" data-i18n="midi.save"></button>
    </section>

    <!-- SETUP -->
    <section id="page-setup" class="page">
      <h2 data-i18n="setup.find"></h2>
      <div class="row wrap" id="find"></div>
      <h2 data-i18n="setup.channel_tester"></h2>
      <div class="row wrap">
        <input id="chanuni" type="number" min="0" max="15" value="0" class="narrow" data-i18n-title="setup.universe">
        <input id="chan" type="number" min="1" max="512" class="narrow" data-i18n-placeholder="setup.channel">
        <input id="chanval" type="range" min="0" max="255" value="0">
        <span id="chanshow">0</span>
        <button id="chan-off" data-i18n="setup.release"></button>
        <button data-cmd="setup_off" data-i18n="setup.clear_tests"></button>
      </div>
      <h2 data-i18n="setup.flash_test"></h2>
      <div class="row"><button data-cmd="flash_test" data-i18n="setup.flash_all"></button></div>
      <h2 data-i18n="setup.devices"></h2>
      <table class="devices"><thead><tr>
        <th data-i18n="setup.col_device"></th><th data-i18n="setup.col_type"></th><th data-i18n="setup.col_state"></th><th data-i18n="setup.col_detail"></th>
      </tr></thead><tbody id="devices"></tbody></table>
      <h2 data-i18n="setup.nodes"></h2>
      <table class="nodes"><thead><tr>
        <th data-i18n="setup.col_name"></th><th>MAC</th><th data-i18n="setup.col_state"></th><th data-i18n="setup.col_signal"></th>
        <th data-i18n="setup.col_loss"></th><th data-i18n="setup.col_last_data"></th><th></th>
      </tr></thead><tbody id="nodes"></tbody></table>
      <h2 data-i18n="setup.addresses"></h2>
      <table class="addr"><thead><tr>
        <th data-i18n="setup.col_fixture"></th><th data-i18n="setup.col_type"></th><th data-i18n="setup.col_uni"></th>
        <th data-i18n="setup.col_start"></th><th data-i18n="setup.col_end"></th><th data-i18n="setup.col_in_rig"></th><th data-i18n="setup.col_checked"></th>
      </tr></thead><tbody id="addr"></tbody></table>
      <div class="muted" id="addrnotes"></div>
      <h2 data-i18n="setup.appearance"></h2>
      <div class="row wrap">
        <label class="muted" for="theme" data-i18n="setup.theme"></label>
        <select id="theme"></select>
      </div>
      <h2 data-i18n="setup.updates"></h2>
      <div class="row wrap">
        <button id="update-check" data-i18n="setup.update_check"></button>
        <span class="muted" id="update-result"></span>
      </div>
    </section>

    <!-- FILES -->
    <section id="page-files" class="page">
      <h2 data-i18n="files.scenes"></h2>
      <div class="list" id="scenes"></div>
      <h2 data-i18n="files.backups"></h2>
      <p class="muted" data-i18n="files.backups_help"></p>
      <div class="list" id="backups"></div>
    </section>
  </main>
</div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
