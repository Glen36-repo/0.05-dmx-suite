<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-name" content="dmx-suite">
<meta name="dmx-token" content="__TOKEN__">
<meta name="theme-color" content="#08080b">
<title>__APP_NAME__</title>
<link rel="icon" href="/static/brand/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/themes/__THEME__/theme.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="density-__DENSITY__">
<header class="top">
  <img src="/static/themes/__THEME__/logo.svg" alt="" class="logo">
  <div class="now" id="now" data-i18n="status.connecting"></div>
  <div class="tempo" id="tempo" data-i18n-title="top.tempo_tip"><span class="beat-dot"></span><span id="tempo-text"></span></div>
  <button id="master" class="toggle master perform" data-i18n="top.master"></button>
  <button id="blackout" class="toggle danger perform" data-i18n="top.blackout"></button>
  <button class="lock" id="giglock" data-i18n="top.giglock" data-i18n-title="top.giglock_tip"></button>
  <button class="bell" id="bell" data-i18n-title="alerts.bell_tip"><span aria-hidden="true">🔔</span><span id="bell-count"></span></button>
</header>
<div class="health" id="health" data-i18n-title="top.health_tip"></div>
<div class="banners" id="banners" aria-live="assertive"></div>
<div class="alerts-panel hidden" id="alerts-panel">
  <div class="row"><h2 data-i18n="alerts.title"></h2><span class="grow"></span>
    <label class="row"><input type="checkbox" id="alerts-quiet"><span data-i18n="alerts.quiet"></span></label>
    <button id="alerts-close" class="mini">✕</button></div>
  <p class="muted" data-i18n="alerts.help"></p>
  <ul class="alerts-list" id="alerts-list"></ul>
</div>

<div class="shell">
  <nav class="menu" id="menu" aria-label="Pages">
    <button class="collapse" id="collapse" data-i18n-title="menu.collapse"><span class="ic">☰</span></button>
    <div class="menu-group" data-i18n="menu.group_perform"></div>
    <button data-page="live" class="on"><span class="ic">◉</span><span class="lbl" data-i18n="menu.live"></span></button>
    <button data-page="ride"><span class="ic">◎</span><span class="lbl" data-i18n="menu.ride"></span></button>
    <button data-page="busk"><span class="ic">◍</span><span class="lbl" data-i18n="menu.busk"></span></button>
    <div class="menu-group" data-i18n="menu.group_build"></div>
    <button data-page="scenes"><span class="ic">◆</span><span class="lbl" data-i18n="menu.scenes"></span></button>
    <button data-page="shows"><span class="ic">▶</span><span class="lbl" data-i18n="menu.shows"></span></button>
    <button data-page="review" class="extra"><span class="ic">★</span><span class="lbl" data-i18n="menu.review"></span></button>
    <button data-page="palettes" class="extra"><span class="ic">◐</span><span class="lbl" data-i18n="menu.palettes"></span></button>
    <div class="menu-group" data-i18n="menu.group_rig"></div>
    <button data-page="layout" class="extra"><span class="ic">▦</span><span class="lbl" data-i18n="menu.layout"></span></button>
    <button data-page="fixtures" class="extra"><span class="ic">⊞</span><span class="lbl" data-i18n="menu.fixtures"></span></button>
    <button data-page="heads" class="extra"><span class="ic">✥</span><span class="lbl" data-i18n="menu.heads"></span></button>
    <button data-page="midi" class="extra"><span class="ic">♪</span><span class="lbl" data-i18n="menu.midi"></span></button>
    <div class="menu-group" data-i18n="menu.group_system"></div>
    <button data-page="setup" class="extra"><span class="ic">⚙</span><span class="lbl" data-i18n="menu.setup"></span></button>
    <button data-page="files" class="extra"><span class="ic">▤</span><span class="lbl" data-i18n="menu.files"></span></button>
    <button id="menu-more" class="more" aria-expanded="false"><span class="ic">⋯</span><span class="lbl" data-i18n="menu.more"></span></button>
  </nav>

  <main>
    <!-- LIVE -->
    <section id="page-live" class="page on">
      <div class="grid-host live" id="live-grid"></div>
      <h2 data-i18n="live.show"></h2>
      <div class="row wrap" id="shows"></div>
      <div class="row wrap" id="sets"></div>
      <ol class="steps" id="steps"></ol>
      <div class="muted" id="step-info"></div>
      <div class="row wrap">
        <button data-cmd="next" data-i18n="live.next"></button>
        <button data-cmd="look" data-i18n="live.static_look"></button>
        <button id="tap" data-i18n="live.tap"></button>
        <input id="bpm" type="number" min="40" max="240" step="1" class="narrow" data-i18n-placeholder="live.bpm_placeholder">
        <button id="bpm-set" data-i18n="live.bpm_set"></button>
        <button data-cmd="tempo" data-bpm="off" data-i18n="live.tempo_off"></button>
        <span class="muted" id="preview"></span>
      </div>
      <h2 data-i18n="live.setlist"></h2>
      <div class="row wrap">
        <select id="setlist"></select>
        <button id="setlist-go" data-i18n="live.start"></button>
        <button data-cmd="song" data-song="prev" data-i18n="live.prev_song"></button>
        <button data-cmd="song" data-song="next" data-i18n="live.next_song"></button>
      </div>
      <ol class="songs" id="songs"></ol>
      <h2 data-i18n="live.masters"></h2>
      <div class="faders" id="faders"></div>
      <h2 data-i18n="live.haze"></h2>
      <div class="row wrap">
        <button data-haze="off" data-i18n="haze.off"></button>
        <button data-haze="manual" data-i18n="haze.manual"></button>
        <button data-haze="pulse" data-i18n="haze.pulse"></button>
        <button id="boost" class="hold perform" data-i18n="haze.boost"></button>
      </div>
      <div class="muted" id="haze"></div>
    </section>

    <!-- LAYOUT -->
    <section id="page-layout" class="page">
      <div class="tabs" id="group-tabs" role="tablist"></div>
      <div class="toolbar">
        <div class="tools" role="group">
          <button data-tool="select" class="sel" data-i18n-title="layout.tool_select_tip"><span data-i18n="layout.tool_select"></span></button>
          <button data-tool="lasso" data-i18n-title="layout.tool_lasso_tip"><span data-i18n="layout.tool_lasso"></span></button>
          <button data-tool="move" data-i18n-title="layout.tool_move_tip"><span data-i18n="layout.tool_move"></span></button>
        </div>
        <label class="zoom"><span data-i18n="layout.zoom"></span><input type="range" id="zoom" min="50" max="400" step="10" value="100"></label>
        <button id="layout-fit" data-i18n="layout.fit" data-i18n-title="layout.fit_tip"></button>
        <label class="check"><input type="checkbox" id="show-names" checked><span data-i18n="layout.names"></span></label>
        <label class="check"><input type="checkbox" id="show-beams"><span data-i18n="layout.beams"></span></label>
      </div>
      <div class="grid-host edit" id="layout-grid"></div>
      <div class="muted" id="layout-sel"></div>

      <h2 data-i18n="layout.arrange"></h2>
      <div class="row wrap" id="arrange-tools">
        <button data-align="left" data-i18n="layout.align_left"></button>
        <button data-align="hcentre" data-i18n="layout.align_hcentre"></button>
        <button data-align="right" data-i18n="layout.align_right"></button>
        <button data-align="top" data-i18n="layout.align_top"></button>
        <button data-align="vcentre" data-i18n="layout.align_vcentre"></button>
        <button data-align="bottom" data-i18n="layout.align_bottom"></button>
        <button data-distribute="h" data-i18n="layout.distribute_h"></button>
        <button data-distribute="v" data-i18n="layout.distribute_v"></button>
      </div>
      <div class="row wrap">
        <button data-make="row" data-i18n="layout.make_row"></button>
        <button data-make="ring" data-i18n="layout.make_ring"></button>
        <button data-make="grid" data-i18n="layout.make_grid"></button>
        <button data-rotate="-45" data-i18n="layout.rotate_l"></button>
        <button data-rotate="45" data-i18n="layout.rotate_r"></button>
        <span class="muted" data-i18n="layout.pixels"></span>
        <button data-shape="row" data-i18n="layout.shape_row"></button>
        <button data-shape="ring" data-i18n="layout.shape_ring"></button>
        <button data-shape="grid" data-i18n="layout.shape_grid"></button>
      </div>
      <div class="row wrap">
        <button id="layout-save" data-i18n="layout.save"></button>
        <button id="layout-undo" data-i18n="layout.undo"></button>
        <button id="layout-reset" data-i18n="layout.reset"></button>
      </div>

      <h2 data-i18n="groups.title"></h2>
      <div class="row wrap">
        <input id="group-name" maxlength="40" data-i18n-placeholder="groups.name_placeholder">
        <button id="group-new" data-i18n="groups.new"></button>
        <button id="group-set" data-i18n="groups.set"></button>
        <button id="group-rename" data-i18n="groups.rename"></button>
        <button id="group-delete" class="danger-text" data-i18n="groups.delete"></button>
      </div>
      <p class="muted" data-i18n="groups.help"></p>
    </section>

    <!-- SCENES -->
    <section id="page-scenes" class="page">
      <div class="row wrap scene-bar">
        <select id="scene-pick" data-i18n-title="scenes.pick"></select>
        <button id="scene-new" data-i18n="scenes.new"></button>
        <button id="scene-dup" data-i18n="scenes.duplicate"></button>
        <button id="scene-del" class="danger-text" data-i18n="scenes.delete"></button>
        <input id="scene-name" maxlength="60" data-i18n-placeholder="scenes.name_placeholder">
        <label class="check"><input type="checkbox" id="scene-steps"><span data-i18n="steps.toggle"></span></label>
        <button id="scene-save" data-i18n="scenes.save"></button>
        <span class="muted" id="scene-state"></span>
      </div>
      <div class="builder">
        <div class="builder-left">
          <div class="pick-tabs" id="scene-group-tabs" role="tablist"></div>
          <div class="grid-host pick" id="scene-grid"></div>
          <div class="row wrap">
            <span class="muted" id="scene-sel"></span>
          </div>
          <div class="row wrap">
            <label class="check"><input type="checkbox" id="scene-preview"><span data-i18n="scenes.live_preview"></span></label>
            <span class="muted" id="scene-preview-note"></span>
          </div>
        </div>
        <div class="builder-right">
          <div id="steps-editor" class="hidden"></div>
          <h2 id="layers-title" data-i18n="scenes.layers"></h2>
          <ol class="layers" id="layers"></ol>
          <div class="row wrap">
            <button id="layer-add" data-i18n="scenes.add_layer"></button>
            <button id="look-copy" data-i18n="scenes.copy" data-i18n-title="scenes.copy_tip"></button>
            <button id="look-paste" data-i18n="scenes.paste" data-i18n-title="scenes.paste_tip"></button>
          </div>
          <div class="error hidden" id="scene-error" role="alert"></div>
          <h2 id="layer-title" data-i18n="scenes.layer"></h2>
          <div id="layer-form" class="form"></div>
          <details class="scene-more">
            <summary data-i18n="scenes.scene_settings"></summary>
            <div class="form">
              <label class="field"><span data-i18n="scenes.show_colour"></span><span id="scene-show-colour"></span></label>
              <label class="field"><span data-i18n="scenes.length"></span><input id="scene-length" type="number" min="0" step="0.5" class="narrow"></label>
            </div>
          </details>
        </div>
      </div>
    </section>

    <!-- SHOWS -->
    <section id="page-shows" class="page">
      <h2 data-i18n="shows.title"></h2>
      <div class="row wrap">
        <select id="show-pick"></select>
        <button id="show-new" data-i18n="shows.new"></button>
        <button id="show-del" class="danger-text" data-i18n="shows.delete"></button>
        <input id="show-name" maxlength="60" data-i18n-placeholder="shows.name_placeholder">
        <button id="show-save" data-i18n="shows.save"></button>
        <span class="muted" id="show-state"></span>
      </div>
      <div class="tabs" id="set-tabs" role="tablist"></div>
      <div class="row wrap">
        <button id="set-add" data-i18n="shows.add_set"></button>
        <button id="set-del" class="danger-text" data-i18n="shows.delete_set"></button>
        <label class="check"><input type="radio" name="default-set" id="set-default"><span data-i18n="shows.default_set"></span></label>
      </div>
      <div id="set-form" class="form"></div>

      <h2 data-i18n="setlists.title"></h2>
      <div class="row wrap">
        <select id="setlist-pick"></select>
        <button id="setlist-new" data-i18n="setlists.new"></button>
        <button id="setlist-del" class="danger-text" data-i18n="setlists.delete"></button>
        <input id="setlist-name" maxlength="60" data-i18n-placeholder="setlists.name_placeholder">
        <button id="setlist-save" data-i18n="setlists.save"></button>
        <span class="muted" id="setlist-state"></span>
      </div>
      <ol class="songs-edit" id="songs-edit"></ol>
      <button id="song-add" data-i18n="setlists.add_song"></button>
    </section>

    <!-- BUSK -->
    <section id="page-busk" class="page">
      <div class="row wrap">
        <select id="panel-pick"></select>
        <button id="busk-release" class="danger" data-i18n="busk.release_all"></button>
        <label class="check"><input type="checkbox" id="busk-edit"><span data-i18n="busk.edit"></span></label>
      </div>
      <div class="busk" id="busk"></div>
      <div id="busk-editor" class="hidden">
        <div class="row wrap">
          <input id="panel-key" maxlength="40" data-i18n-placeholder="busk.panel_key">
          <input id="panel-name" maxlength="60" data-i18n-placeholder="busk.panel_name">
          <label class="field-inline"><span data-i18n="busk.release_fade"></span><input id="panel-fade" type="number" min="0" max="30" step="0.1" class="narrow"></label>
          <button id="panel-new" data-i18n="busk.new_panel"></button>
          <button id="panel-del" class="danger-text" data-i18n="busk.delete_panel"></button>
        </div>
        <ol class="widgets-edit" id="widgets-edit"></ol>
        <div class="row wrap">
          <select id="widget-type"></select>
          <button id="widget-add" data-i18n="busk.add_widget"></button>
          <button id="panels-save" data-i18n="busk.save"></button>
          <span class="muted" id="busk-state"></span>
        </div>
      </div>
    </section>

    <!-- HEADS -->
    <section id="page-heads" class="page">
      <p class="muted" data-i18n="heads.help"></p>
      <div class="row wrap">
        <button id="fine" data-i18n="heads.fine" data-i18n-title="heads.fine_tip"></button>
        <button data-cmd="release_positions" data-i18n="heads.release_all"></button>
      </div>
      <div class="focus-bar row wrap hidden" id="focus"></div>
      <div class="heads" id="heads"></div>
      <h2 data-i18n="heads.store_title"></h2>
      <div class="cols c150">
        <input id="point-name" maxlength="40" data-i18n-placeholder="heads.position_placeholder">
        <input id="point-desc" class="span2" data-i18n-placeholder="heads.desc_placeholder">
        <input id="point-tags" data-i18n-placeholder="heads.tags_placeholder">
        <select id="point-x"></select><select id="point-y"></select><select id="point-z"></select>
        <button id="point-store" data-i18n="heads.save_position"></button>
      </div>
      <h2 data-i18n="heads.points"></h2>
      <div class="row wrap"><button id="point-walk" data-i18n="heads.walk"></button></div>
      <div id="point-problems"></div>
      <ul class="point-list" id="point-list"></ul>
    </section>

    <!-- RIDE -->
    <section id="page-ride" class="page">
      <div class="row wrap ride-top">
        <button id="ap-toggle" class="toggle big" data-i18n="ride.autopilot_off"></button>
        <span class="row" id="ride-moods">
          <button data-mood="low" class="big" data-i18n="ride.mood_low"></button>
          <button data-mood="mid" class="big" data-i18n="ride.mood_mid"></button>
          <button data-mood="high" class="big" data-i18n="ride.mood_high"></button>
          <button data-mood="auto" data-i18n="ride.mood_auto"></button>
        </span>
        <button id="ap-hold" class="toggle big" data-i18n="ride.hold"></button>
        <button id="ap-prev" class="big" data-i18n="ride.prev"></button>
        <button id="ap-next" class="big" data-i18n="ride.next"></button>
        <button id="ride-learn" data-i18n="ride.learn" data-i18n-title="ride.learn_help"></button>
      </div>
      <div class="row wrap">
        <div class="energy" data-i18n-title="ride.energy"><i id="ap-energy"></i></div>
        <span class="muted" id="ap-state"></span>
      </div>
      <div class="grid-host strip" id="ride-grid"></div>
      <div class="ride-banks">
        <div><h2 data-i18n="ride.move_fx"></h2><div class="ride-col" id="ride-move"></div></div>
        <div><h2 data-i18n="ride.flash_fx"></h2><div class="ride-col" id="ride-flash"></div></div>
        <div><h2 data-i18n="ride.colour_fx"></h2><div class="ride-col" id="ride-colour"></div></div>
      </div>
      <div class="pair">
        <div><h2 data-i18n="ride.drum_fx"></h2><div class="row wrap" id="ride-drum"></div></div>
        <div><h2 data-i18n="ride.palette"></h2>
          <div class="row wrap"><span id="ride-palettes" class="row wrap"></span><button id="ride-lock" class="toggle" data-i18n="ride.lock"></button></div></div>
      </div>
      <h2 data-i18n="ride.controls"></h2>
      <div class="tabs" id="ride-tabs" role="tablist"></div>
      <div class="ride-faders" id="ride-faders"></div>
      <h2 data-i18n="ride.presets"></h2>
      <div class="row wrap ride-presets" id="ride-presets"></div>
      <div class="row wrap">
        <button id="ride-save-preset" data-i18n="ride.save_preset"></button>
        <button id="ride-capture" data-i18n="ride.capture"></button>
        <button id="ride-more" data-i18n="ride.more"></button>
        <span class="sep-v"></span>
        <button id="ride-reroll" data-i18n="ride.reroll"></button>
        <span class="muted" data-i18n="ride.keep"></span>
        <label class="chip"><input type="checkbox" data-lock="move"><span data-i18n="ride.bank_move"></span></label>
        <label class="chip"><input type="checkbox" data-lock="colour"><span data-i18n="ride.bank_colour"></span></label>
        <label class="chip"><input type="checkbox" data-lock="drum"><span data-i18n="ride.bank_drum"></span></label>
        <label class="chip"><input type="checkbox" data-lock="palette"><span data-i18n="ride.palette"></span></label>
        <label class="chip"><input type="checkbox" data-lock="feel"><span data-i18n="ride.controls"></span></label>
      </div>
      <div class="row wrap" id="ride-variations"></div>
      <h2 data-i18n="ride.haze"></h2>
      <div class="row wrap">
        <button data-haze="off" data-i18n="haze.off"></button>
        <button data-haze="manual" data-i18n="haze.manual"></button>
        <button data-haze="pulse" data-i18n="haze.pulse"></button>
        <button id="ride-boost" class="hold perform" data-i18n="haze.boost"></button>
        <button id="ride-walk-on" data-i18n="ride.walk_on"></button>
        <button id="ride-walk-off" data-i18n="ride.walk_off"></button>
      </div>
      <h2 data-i18n="ride.why"></h2>
      <ul class="ride-why" id="ride-why"></ul>
      <details class="scene-more">
        <summary data-i18n="ride.lights"></summary>
        <p class="muted" data-i18n="ride.lights_help"></p>
        <ul class="point-list" id="ride-lights"></ul>
      </details>
    </section>

    <!-- REVIEW -->
    <section id="page-review" class="page">
      <p class="muted" data-i18n="review.help"></p>
      <div class="row wrap">
        <select id="rv-mood"><option value="" data-i18n="review.all_moods"></option><option value="low" data-i18n="ride.mood_low"></option><option value="mid" data-i18n="ride.mood_mid"></option><option value="high" data-i18n="ride.mood_high"></option></select>
        <select id="rv-bank"><option value="" data-i18n="review.both_banks"></option><option value="move" data-i18n="ride.move_fx"></option><option value="colour" data-i18n="ride.colour_fx"></option></select>
        <select id="rv-palette"></select>
        <span class="muted" id="rv-count"></span>
      </div>
      <div class="row wrap">
        <button id="rv-prev" class="big" data-i18n="ride.prev"></button>
        <button id="rv-up" class="big" data-i18n="review.like"></button>
        <button id="rv-down" class="big" data-i18n="review.dislike"></button>
        <button id="rv-ban" class="big danger-text" data-i18n="review.ban"></button>
        <button id="rv-clear" data-i18n="review.clear"></button>
        <button id="rv-next" class="big" data-i18n="ride.next"></button>
        <button id="rv-auto" data-i18n="review.auto"></button>
        <input id="rv-every" type="number" min="2" max="60" value="8" class="narrow" data-i18n-title="review.every">
      </div>
      <h2 id="rv-now"></h2>
      <ol class="rv-list" id="rv-list"></ol>
      <details class="section" open data-remember="review.generator">
      <summary data-i18n="review.generator"></summary>
      <p class="muted" data-i18n="review.generator_help"></p>
      <div class="row wrap">
        <select id="gen-mood"><option value="low" data-i18n="ride.mood_low"></option><option value="mid" selected data-i18n="ride.mood_mid"></option><option value="high" data-i18n="ride.mood_high"></option></select>
        <select id="gen-style"><option value="" data-i18n="review.any_style"></option><option value="rock" data-i18n="review.style_rock"></option><option value="ballad" data-i18n="review.style_ballad"></option><option value="acoustic" data-i18n="review.style_acoustic"></option><option value="opera" data-i18n="review.style_opera"></option><option value="dance" data-i18n="review.style_dance"></option></select>
        <select id="gen-palette"></select>
        <input id="gen-count" type="number" min="1" max="50" value="4" class="narrow" data-i18n-title="review.how_many">
        <input id="gen-prefix" maxlength="30" data-i18n-placeholder="review.prefix">
        <input id="gen-seed" maxlength="30" class="narrow" data-i18n-placeholder="review.seed">
        <button id="gen-scenes" data-i18n="review.gen_scenes"></button>
      </div>
      <div class="row wrap">
        <input id="gen-show-name" maxlength="40" data-i18n-placeholder="review.show_name">
        <button id="gen-show" data-i18n="review.gen_show"></button>
        <select id="gen-setlist-pick"></select>
        <button id="gen-setlist" data-i18n="review.gen_setlist"></button>
      </div>
      <div class="muted" id="gen-out"></div>
      </details>
    </section>

    <!-- PALETTES -->
    <section id="page-palettes" class="page">
      <p class="muted" data-i18n="palettes.help"></p>
      <h2 data-i18n="palettes.title"></h2>
      <div class="row wrap">
        <input id="palette-new-name" maxlength="40" data-i18n-placeholder="palettes.new_placeholder">
        <button id="palette-new" data-i18n="palettes.new"></button>
        <label class="button-like"><span data-i18n="palettes.import"></span><input type="file" id="palette-import" accept=".json,application/json" class="hidden-file"></label>
      </div>
      <div id="palette-list"></div>
      <h2 data-i18n="palettes.named"></h2>
      <p class="muted" data-i18n="palettes.named_help"></p>
      <div class="row wrap">
        <input id="colour-new-name" maxlength="40" data-i18n-placeholder="palettes.colour_placeholder">
        <button id="colour-new" data-i18n="palettes.new_colour"></button>
      </div>
      <ul class="named-colours" id="named-colours"></ul>
    </section>

    <!-- MIDI -->
    <section id="page-midi" class="page">
      <h2 data-i18n="midi.inputs"></h2>
      <p class="muted" data-i18n="midi.inputs_help"></p>
      <div class="row wrap">
        <input id="device-new-id" maxlength="40" data-i18n-placeholder="midi.device_placeholder">
        <button id="device-new" data-i18n="midi.add_device"></button>
        <select id="profile-pick"></select>
      </div>
      <div id="input-edit"></div>
      <div id="inputs"></div>
      <h2 data-i18n="midi.monitor"></h2>
      <div class="row wrap">
        <button id="midi-pause" data-i18n="midi.pause"></button>
        <button id="midi-clear" data-i18n="midi.clear"></button>
        <select id="midi-filter"></select>
      </div>
      <table class="monitor"><thead><tr>
        <th data-i18n="midi.col_time"></th><th data-i18n="midi.col_port"></th><th data-i18n="midi.col_ch"></th>
        <th data-i18n="midi.col_type"></th><th>#</th><th data-i18n="midi.col_value"></th><th data-i18n="midi.col_named"></th><th data-i18n="midi.col_triggered"></th>
      </tr></thead><tbody id="monitor"></tbody></table>
      <h2 data-i18n="midi.learn"></h2>
      <div class="row wrap">
        <select id="learn-action"></select>
        <input id="learn-params" data-i18n-placeholder="midi.params_placeholder">
        <button id="learn-go" data-i18n="midi.learn_go"></button>
        <button id="learn-cancel" data-i18n="midi.learn_cancel"></button>
        <span id="learn-state" class="muted"></span>
      </div>
      <details class="section" id="map-section" data-remember="midi.map">
        <summary><span data-i18n="midi.mapping"></span><span class="sum muted" data-i18n="midi.mapping_sum"></span></summary>
        <table class="map"><thead><tr>
          <th data-i18n="midi.col_input"></th><th data-i18n="midi.col_message"></th><th>#</th><th data-i18n="midi.col_action"></th><th></th>
        </tr></thead><tbody id="map"></tbody></table>
        <button id="map-save" data-i18n="midi.save"></button>
      </details>
    </section>

    <!-- SETUP -->
    <section id="page-setup" class="page">
      <h2 data-i18n="setup.find"></h2>
      <div class="row wrap" id="find"></div>
      <h2 data-i18n="setup.channel_tester"></h2>
      <div class="row wrap">
        <input id="chanuni" type="number" min="0" max="15" value="0" class="narrow" data-i18n-title="setup.universe">
        <input id="chan" type="number" min="1" max="512" class="narrow" data-i18n-placeholder="setup.channel">
        <input id="chanval" type="range" min="0" max="255" value="0">
        <span id="chanshow">0</span>
        <button id="chan-off" data-i18n="setup.release"></button>
        <button data-cmd="setup_off" data-i18n="setup.clear_tests"></button>
      </div>
      <h2 data-i18n="setup.flash_test"></h2>
      <div class="row"><button data-cmd="flash_test" data-i18n="setup.flash_all"></button></div>
      <div class="pair">
        <div>
          <h2 data-i18n="setup.devices"></h2>
          <table class="devices"><thead><tr>
            <th data-i18n="setup.col_device"></th><th data-i18n="setup.col_type"></th><th data-i18n="setup.col_state"></th><th data-i18n="setup.col_detail"></th>
          </tr></thead><tbody id="devices"></tbody></table>
        </div>
        <div>
          <h2 data-i18n="setup.nodes"></h2>
          <table class="nodes"><thead><tr>
            <th data-i18n="setup.col_name"></th><th>MAC</th><th data-i18n="setup.col_state"></th><th data-i18n="setup.col_signal"></th>
            <th data-i18n="setup.col_loss"></th><th data-i18n="setup.col_last_data"></th><th></th>
          </tr></thead><tbody id="nodes"></tbody></table>
          <div class="row wrap">
            <span class="muted" id="node-setup"></span>
            <button id="node-resend" data-i18n="setup.node_resend" data-i18n-title="setup.node_resend_tip"></button>
            <label class="field-inline"><span data-i18n="setup.radio_channel"></span>
              <input type="number" id="radio-channel" min="1" max="13" class="num"></label>
            <button id="radio-move" data-i18n="setup.radio_move"></button>
          </div>
        </div>
      </div>
      <details class="section" id="addr-section" data-remember="setup.addr">
        <summary><span data-i18n="setup.addresses"></span><span class="sum muted" id="addrnotes"></span></summary>
        <table class="addr"><thead><tr>
          <th data-i18n="setup.col_fixture"></th><th data-i18n="setup.col_type"></th><th data-i18n="setup.col_uni"></th>
          <th data-i18n="setup.col_start"></th><th data-i18n="setup.col_end"></th><th data-i18n="setup.col_in_rig"></th><th data-i18n="setup.col_checked"></th>
        </tr></thead><tbody id="addr"></tbody></table>
      </details>
      <h2 data-i18n="access.title"></h2>
      <div class="access" id="access">
        <p class="muted" id="access-state"></p>
        <div class="row wrap">
          <input type="password" id="pin-old" autocomplete="current-password" data-i18n-placeholder="access.pin_old">
          <input type="password" id="pin-new" autocomplete="new-password" data-i18n-placeholder="access.pin_new">
          <button id="pin-set" data-i18n="access.pin_set"></button>
          <button id="pin-clear" class="danger-text" data-i18n="access.pin_clear"></button>
        </div>
        <div class="row wrap">
          <label class="check"><input type="checkbox" id="access-lan"><span data-i18n="access.lan"></span></label>
          <label class="check"><input type="checkbox" id="access-local"><span data-i18n="access.pin_local"></span></label>
          <label class="field-inline"><span data-i18n="access.session_hours"></span>
            <input type="number" id="access-hours" min="0.25" max="168" step="0.25" class="num"></label>
        </div>
        <div class="lan-info hidden" id="lan-info">
          <div class="qr" id="lan-qr"></div>
          <div><p data-i18n="access.lan_help"></p><ul class="urls" id="lan-urls"></ul></div>
        </div>
        <button id="logout" class="hidden" data-i18n="access.logout"></button>
      </div>
      <details class="section" id="claude-section">
        <summary><span data-i18n="claude.title"></span><span class="sum muted" id="claude-sum"></span></summary>
        <div id="claude-connect" class="claude-connect"></div>
      </details>
      <h2 data-i18n="setup.appearance"></h2>
      <div class="row wrap">
        <label class="muted" for="theme" data-i18n="setup.theme"></label>
        <select id="theme"></select>
        <label class="muted" for="density" data-i18n="setup.density"></label>
        <select id="density"><option value="compact" data-i18n="setup.density_compact"></option><option value="comfortable" data-i18n="setup.density_comfortable"></option></select>
      </div>
      <h2 data-i18n="setup.updates"></h2>
      <div class="row wrap">
        <button id="update-check" data-i18n="setup.update_check"></button>
        <span class="muted" id="update-result"></span>
      </div>
      <h2 data-i18n="wizard.title"></h2>
      <div class="row wrap"><button id="wizard-open" data-i18n="wizard.open"></button><span class="muted" data-i18n="wizard.open_help"></span></div>
    </section>

    <!-- FIXTURES -->
    <section id="page-fixtures" class="page">
      <div class="tabs" id="fx-tabs" role="tablist">
        <button data-tab="patch" class="on" data-i18n="fixtures.tab_patch"></button>
        <button data-tab="types" data-i18n="fixtures.tab_types"></button>
        <button data-tab="rig" data-i18n="fixtures.tab_rig"></button>
        <span class="muted" id="fx-state"></span>
      </div>
      <div id="fx-tab-patch">
        <p class="muted" data-i18n="fixtures.patch_help"></p>
        <table class="grid-table">
          <thead><tr><th data-i18n="fixtures.col_id"></th><th data-i18n="fixtures.col_type"></th><th data-i18n="fixtures.col_universe"></th>
            <th data-i18n="fixtures.col_address"></th><th data-i18n="fixtures.col_channels"></th><th data-i18n="fixtures.col_groups"></th>
            <th data-i18n="fixtures.col_sub"></th><th></th></tr></thead>
          <tbody id="fx-patch"></tbody>
        </table>
        <div class="error" id="fx-clash" role="alert"></div>
        <div class="row wrap">
          <select id="fx-add-type"></select>
          <input id="fx-add-count" type="number" min="1" max="64" value="1" class="num" data-i18n-title="fixtures.add_count">
          <input id="fx-add-id" class="narrow" data-i18n-placeholder="fixtures.add_id">
          <button id="fx-add" data-i18n="fixtures.add"></button>
          <button id="fx-auto" data-i18n="fixtures.auto_patch" data-i18n-title="fixtures.auto_patch_tip"></button>
          <button id="fx-patch-save" data-i18n="fixtures.save_patch"></button>
        </div>
      </div>
      <div id="fx-tab-types" class="hidden">
        <div class="row wrap">
          <select id="fx-type-pick"></select>
          <button id="fx-type-new" data-i18n="fixtures.new_type"></button>
          <label class="button"><span data-i18n="fixtures.import_ofl"></span><input type="file" id="fx-ofl" accept=".json" class="hidden"></label>
          <button id="fx-ofl-export" data-i18n="fixtures.export_ofl"></button>
          <button id="fx-type-del" class="danger-text" data-i18n="fixtures.delete_type"></button>
          <button id="fx-type-save" data-i18n="fixtures.save_type"></button>
        </div>
        <div id="fx-type"></div>
      </div>
      <div id="fx-tab-rig" class="hidden">
        <div class="row wrap">
          <select id="fx-rig-pick"></select>
          <button id="fx-rig-use" data-i18n="fixtures.use_rig"></button>
          <button id="fx-rig-save" data-i18n="fixtures.save_rig"></button>
          <span class="muted" id="fx-rig-state"></span>
        </div>
        <p class="muted" data-i18n="fixtures.rig_help"></p>
        <div id="fx-rig"></div>
      </div>
    </section>

    <!-- FILES -->
    <section id="page-files" class="page">
      <h2 data-i18n="project.title"></h2>
      <p id="project-now"></p>
      <div class="row wrap">
        <button id="project-open" data-i18n="project.open"></button>
        <button id="project-save-as" data-i18n="project.save_as"></button>
        <button id="project-new" data-i18n="project.new"></button>
        <a id="project-download" class="button" href="/api/project/download" data-i18n="project.download"></a>
        <label class="button"><span data-i18n="project.upload"></span><input type="file" id="project-upload" accept=".dms" class="hidden"></label>
      </div>
      <div class="row wrap hidden" id="project-path-row">
        <input id="project-path" class="wide" data-i18n-placeholder="project.path_placeholder">
        <button id="project-path-go" data-i18n="project.go"></button>
        <button id="project-path-cancel" data-i18n="project.cancel"></button>
      </div>
      <h3 data-i18n="project.recent"></h3>
      <ul class="recent" id="project-recent"></ul>
      <h2 data-i18n="files.scenes"></h2>
      <div class="list" id="scenes"></div>
      <h2 data-i18n="history.title"></h2>
      <p class="muted" data-i18n="history.help"></p>
      <div class="row wrap">
        <button id="undo" data-i18n="history.undo"></button>
        <button id="redo" data-i18n="history.redo"></button>
      </div>
      <ol class="history" id="history"></ol>
      <h2 data-i18n="files.backups"></h2>
      <p class="muted" data-i18n="files.backups_help"></p>
      <div class="list" id="backups"></div>
    </section>
  </main>
</div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<dialog id="wizard" class="wizard-dialog"></dialog>
<div class="offline-box" id="offline" role="alert"><strong data-i18n="status.lost_title"></strong><span data-i18n="status.lost_help"></span></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
