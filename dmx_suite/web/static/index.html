<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-name" content="dmx-suite">
<meta name="dmx-token" content="__TOKEN__">
<meta name="theme-color" content="#08080b">
<title>__APP_NAME__</title>
<link rel="icon" href="/static/brand/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/themes/__THEME__/theme.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="density-__DENSITY__">
<header class="top">
  <img src="/static/themes/__THEME__/logo.svg" alt="" class="logo">
  <div class="now" id="now" data-i18n="status.connecting"></div>
  <div class="tempo" id="tempo" data-i18n-title="top.tempo_tip"><span class="beat-dot"></span><span id="tempo-text"></span></div>
  <button id="master" class="toggle master perform" data-i18n="top.master"></button>
  <button id="blackout" class="toggle danger perform" data-i18n="top.blackout"></button>
  <button class="lock" id="giglock" data-i18n="top.giglock" data-i18n-title="top.giglock_tip"></button>
  <button class="bell" id="bell" data-i18n-title="alerts.bell_tip"><span aria-hidden="true">🔔</span><span id="bell-count"></span></button>
</header>
<div class="health-row"><div class="health" id="health" data-i18n-title="top.health_tip"></div><button type="button" class="info" data-info="top.status" aria-expanded="false">ⓘ</button></div>
<div class="banners" id="banners" aria-live="assertive"></div>
<div class="alerts-panel hidden" id="alerts-panel">
  <div class="row"><h2><span data-i18n="alerts.title"></span> <button type="button" class="info" data-info="top.alerts" aria-expanded="false">ⓘ</button></h2><span class="grow"></span>
    <label class="row"><input type="checkbox" id="alerts-quiet"><span data-i18n="alerts.quiet"></span></label>
    <button id="alerts-close" class="mini">✕</button></div>
  <ul class="alerts-list" id="alerts-list"></ul>
</div>

<div class="shell">
  <nav class="menu" id="menu" aria-label="Pages">
    <button class="collapse" id="collapse" data-i18n-title="menu.collapse"><span class="ic">☰</span></button>
    <div class="menu-group" data-i18n="menu.group_perform"></div>
    <button data-page="live" class="on"><span class="ic">◉</span><span class="lbl" data-i18n="menu.live"></span></button>
    <button data-page="autopilot"><span class="ic">◎</span><span class="lbl" data-i18n="menu.autopilot"></span></button>
    <button data-page="override"><span class="ic">◍</span><span class="lbl" data-i18n="menu.override"></span></button>
    <div class="menu-group" data-i18n="menu.group_build"></div>
    <button data-page="scenes"><span class="ic">◆</span><span class="lbl" data-i18n="menu.scenes"></span></button>
    <button data-page="shows"><span class="ic">▶</span><span class="lbl" data-i18n="menu.shows"></span></button>
    <button data-page="review" class="extra"><span class="ic">★</span><span class="lbl" data-i18n="menu.review"></span></button>
    <button data-page="palettes" class="extra"><span class="ic">◐</span><span class="lbl" data-i18n="menu.palettes"></span></button>
    <div class="menu-group" data-i18n="menu.group_rig"></div>
    <button data-page="layout" class="extra"><span class="ic">▦</span><span class="lbl" data-i18n="menu.layout"></span></button>
    <button data-page="fixtures" class="extra"><span class="ic">⊞</span><span class="lbl" data-i18n="menu.fixtures"></span></button>
    <button data-page="heads" class="extra"><span class="ic">✥</span><span class="lbl" data-i18n="menu.heads"></span></button>
    <button data-page="midi" class="extra"><span class="ic">♪</span><span class="lbl" data-i18n="menu.midi"></span></button>
    <div class="menu-group" data-i18n="menu.group_system"></div>
    <button data-page="monitor" class="extra"><span class="ic">⌁</span><span class="lbl" data-i18n="menu.monitor"></span></button>
    <button data-page="setup" class="extra"><span class="ic">⚙</span><span class="lbl" data-i18n="menu.setup"></span></button>
    <button data-page="files" class="extra"><span class="ic">▤</span><span class="lbl" data-i18n="menu.files"></span></button>
    <button id="menu-more" class="more" aria-expanded="false"><span class="ic">⋯</span><span class="lbl" data-i18n="menu.more"></span></button>
  </nav>

  <main>
    <!-- LIVE -->
    <section id="page-live" class="page on">
      <div class="live-stage-bar"><button type="button" class="mini" id="stage-fold" aria-controls="live-grid"></button></div>
      <div class="grid-host live" id="live-grid"></div>
      <h2><span data-i18n="live.shows"></span> <button type="button" class="info" data-info="live.shows" aria-expanded="false">ⓘ</button></h2>
      <div class="btn-grid" id="shows" data-order="shows"></div>
      <div class="btn-grid sets" id="sets"></div>
      <h2><span data-i18n="live.scenes"></span> <button type="button" class="info" data-info="live.scenes" aria-expanded="false">ⓘ</button></h2>
      <div class="btn-grid" id="scenes" data-order="scenes"></div>
      <details class="section" id="generated-section" data-remember="live.generated">
        <summary><span data-i18n="live.generated"></span> <button type="button" class="info" data-info="live.generated" aria-expanded="false">ⓘ</button></summary>
        <div class="btn-grid" id="generated" data-order="generated"></div>
      </details>
      <ol class="steps" id="steps"></ol>
      <div class="muted" id="step-info"></div>
      <div class="row wrap">
        <button data-cmd="next" data-i18n="live.next"></button>
        <button data-cmd="look" data-i18n="live.static_look"></button>
        <button id="tap" data-i18n="live.tap"></button>
        <input id="bpm" type="number" min="40" max="240" step="1" class="narrow" data-i18n-placeholder="live.bpm_placeholder">
        <button id="bpm-set" data-i18n="live.bpm_set"></button>
        <button data-cmd="tempo" data-bpm="off" data-i18n="live.tempo_off"></button>
        <span class="muted" id="preview"></span>
      </div>
      <h2><span data-i18n="live.setlist"></span> <button type="button" class="info" data-info="live.setlist" aria-expanded="false">ⓘ</button></h2>
      <div class="row wrap">
        <select id="setlist" data-i18n-title="a11y.setlist"></select>
        <button id="setlist-go" data-i18n="live.start"></button>
        <button data-cmd="song" data-song="prev" data-i18n="live.prev_song"></button>
        <button data-cmd="song" data-song="next" data-i18n="live.next_song"></button>
      </div>
      <ol class="songs" id="songs"></ol>
      <h2><span data-i18n="live.masters"></span> <button type="button" class="info" data-info="live.masters" aria-expanded="false">ⓘ</button></h2>
      <div class="faders" id="faders"></div>
      <h2 data-i18n="live.haze"></h2>
      <div class="row wrap">
        <button data-haze="off" data-i18n="haze.off"></button>
        <button data-haze="manual" data-i18n="haze.manual"></button>
        <button data-haze="pulse" data-i18n="haze.pulse"></button>
        <button id="boost" class="hold perform" data-i18n="haze.boost"></button>
        <select id="haze-preset" data-i18n-title="haze.preset_tip"></select>
      </div>
      <div class="muted" id="haze"></div>
      <details class="section haze-settings" id="haze-settings">
        <summary><span data-i18n="haze.settings"></span> <button type="button" class="info" data-info="live.haze" aria-expanded="false">ⓘ</button> <span class="sum muted" id="haze-rig"></span></summary>
        <div class="hz-blocks" id="hz-blocks"></div>
        <div class="row wrap">
          <button id="hz-save" class="primary" data-i18n="haze.save" disabled></button>
          <button id="hz-revert" data-i18n="haze.revert" disabled></button>
          <span class="muted" data-i18n="haze.live_note"></span>
        </div>
      </details>
    </section>

    <!-- MONITOR (v4): watch DMX out, MIDI in, MIDI out; read-only, works under gig lock -->
    <section id="page-monitor" class="page wide">
      <div class="mon-panes" id="mon-panes">
        <div class="mon-pane" id="mon-dmx" data-pane="dmx">
          <div class="mon-head"><h2><span data-i18n="monitor.dmx"></span> <button type="button" class="info" data-info="monitor.dmx" aria-expanded="false">ⓘ</button></h2><span class="grow"></span>
            <select id="mon-uni" data-i18n-title="monitor.universe"></select>
            <select id="mon-out" data-i18n-title="monitor.interface"></select>
            <div class="seg-row" id="mon-dmx-view">
              <button data-view="grid" class="sel" data-i18n="monitor.v_grid"></button>
              <button data-view="fixture" data-i18n="monitor.v_fixture"></button>
              <button data-view="changed" data-i18n="monitor.v_changed"></button>
              <button data-view="hex" data-i18n="monitor.v_hex"></button>
            </div>
            <button class="mini" id="ff-open" data-i18n="ff.open"></button>
            <button class="mini" data-act="pause" data-i18n="monitor.pause"></button>
            <button class="mini" data-act="csv" data-i18n="monitor.csv"></button>
            <button class="mini" data-act="full" data-i18n="monitor.full"></button>
          </div>
          <div class="mon-stats" id="mon-dmx-stats"></div>
          <div class="ff hidden" id="ff">
            <div class="ff-head"><strong data-i18n="ff.title"></strong> <span class="muted" id="ff-where"></span><span class="grow"></span>
              <button class="mini" id="ff-copy" data-i18n="ff.copy"></button><button class="mini" id="ff-close" data-i18n="ff.close"></button></div>
            <div class="mon-flag hidden" id="ff-flag"></div>
            <div class="ff-text" id="ff-text"></div>
            <div class="row" id="ff-answers"></div>
            <ol class="ff-history muted" id="ff-history"></ol>
          </div>
          <div class="mon-stats" id="mon-dmx-timing"></div>
          <div class="mon-checks" id="mon-dmx-checks"></div>
          <div class="mon-flag hidden" id="mon-dmx-flag"></div>
          <div class="mon-body" id="mon-dmx-body"></div>
        </div>
        <div class="mon-pane" id="mon-test" data-pane="test">
          <div class="mon-head"><h2><span data-i18n="test.title"></span> <button type="button" class="info" data-info="test" aria-expanded="false">ⓘ</button></h2><span class="grow"></span>
            <select id="test-pattern" data-i18n-title="test.pattern">
              <option value="all_full" data-i18n="test.p_all_full"></option>
              <option value="chase" data-i18n="test.p_chase"></option>
              <option value="find" data-i18n="test.p_find"></option>
              <option value="ramp" data-i18n="test.p_ramp"></option>
              <option value="keep_alive" data-i18n="test.p_keep_alive"></option>
            </select>
            <select id="test-target" data-i18n-title="test.target"></select>
            <select id="test-fixture" class="hidden" data-i18n-title="test.fixture"></select>
            <input id="test-channel" class="mini num hidden" type="number" min="1" max="512" data-i18n-placeholder="test.channel">
            <input id="test-value" class="mini num hidden" type="number" min="0" max="255" data-i18n-placeholder="test.value">
            <input id="test-dwell" class="mini num hidden" type="number" min="0.2" max="30" step="0.1" value="2" data-i18n-title="test.dwell">
            <label id="test-patched-l" class="mini"><input type="checkbox" id="test-patched"> <span data-i18n="test.patched_only"></span></label>
            <input id="test-timeout" class="mini num" type="number" min="5" max="600" value="60" data-i18n-title="test.timeout">
            <button id="test-go" class="mini" data-i18n="test.start"></button>
            <button id="cycle-go" class="mini hidden" data-i18n="cycle.start" data-i18n-title="cycle.tip"></button>
          </div>
          <div id="cycle-live" class="cycle-live hidden">
            <div class="muted" id="cycle-of"></div>
            <div class="cycle-step" id="cycle-step"></div>
            <button id="cycle-yes" class="big ok" data-i18n="cycle.yes"></button>
          </div>
          <div class="mon-stats" id="cycle-result"></div>
          <div id="test-live" class="test-live hidden">
            <div class="test-now"><span id="test-name"></span> <strong id="test-what"></strong> <span id="test-left" class="muted"></span></div>
            <button id="test-stop" class="big bad" data-i18n="test.stop"></button>
          </div>
          <div class="muted" id="test-note" data-i18n="test.note"></div>
          <div class="mon-stats" id="test-log"></div>
        </div>
        <div class="mon-pane" id="mon-tempo" data-pane="tempo">
          <div class="mon-head"><h2><span data-i18n="tempo2.title"></span> <button type="button" class="info" data-info="tempo2" aria-expanded="false">ⓘ</button></h2><span class="grow"></span>
            <select id="tempo-source" data-i18n-title="tempo2.source">
              <option value="drums" data-i18n="tempo2.s_drums"></option><option value="tap" data-i18n="tempo2.s_tap"></option>
              <option value="midi_clock" data-i18n="tempo2.s_midi_clock"></option><option value="off" data-i18n="tempo2.s_off"></option></select>
            <button class="mini" id="tempo-tap" data-i18n="tempo2.tap"></button>
            <button class="mini" id="tempo-params-btn" data-i18n="tempo2.settings"></button>
          </div>
          <div class="tempo-read"><b id="tempo-bpm"></b> <span id="tempo-beat" class="tempo-beat"></span> <span id="tempo-info" class="muted"></span></div>
          <canvas id="tempo-lanes" class="tempo-canvas" height="120"></canvas>
          <canvas id="tempo-graph" class="tempo-canvas" height="70"></canvas>
          <div id="tempo-params" class="tempo-params hidden"></div>
        </div>
        <div class="mon-pane" id="mon-midi-in" data-pane="midi-in">
          <div class="mon-head"><h2><span data-i18n="monitor.midi_in"></span> <button type="button" class="info" data-info="monitor.midi_in" aria-expanded="false">ⓘ</button></h2><span class="grow"></span>
            <input id="mon-in-port" class="mini" data-i18n-placeholder="monitor.f_port">
            <input id="mon-in-ch" class="mini num" type="number" min="0" max="16" data-i18n-placeholder="monitor.f_channel">
            <select id="mon-in-type" data-i18n-title="a11y.mon_in_type"><option value="" data-i18n="monitor.f_all_types"></option>
              <option value="note" data-i18n="monitor.t_note"></option><option value="control_change" data-i18n="monitor.t_cc"></option><option value="program_change" data-i18n="monitor.t_pc"></option>
              <option value="pitchwheel" data-i18n="monitor.t_bend"></option><option value="sysex" data-i18n="monitor.t_sysex"></option><option value="osc" data-i18n="monitor.t_osc"></option></select>
            <label class="check"><input type="checkbox" id="mon-in-unmapped"><span data-i18n="monitor.f_unmapped"></span></label>
            <button class="mini" data-act="pause" data-i18n="monitor.pause"></button>
            <button class="mini" data-act="clear" data-i18n="monitor.clear"></button>
            <button class="mini" data-act="csv" data-i18n="monitor.csv"></button>
            <button class="mini" data-act="full" data-i18n="monitor.full"></button>
          </div>
          <div class="mon-stats" id="mon-in-ports"></div>
          <div class="mon-heat" id="mon-heat"></div>
          <div class="mon-body"><table class="mon-log"><thead><tr><th data-i18n="monitor.c_time"></th><th data-i18n="monitor.c_port"></th>
            <th data-i18n="monitor.c_ch"></th><th data-i18n="monitor.c_type"></th><th data-i18n="monitor.c_num"></th>
            <th data-i18n="monitor.c_val"></th><th data-i18n="monitor.c_input"></th><th data-i18n="monitor.c_action"></th><th></th></tr></thead>
            <tbody id="mon-in-log"></tbody></table></div>
        </div>
        <div class="mon-pane" id="mon-midi-out" data-pane="midi-out">
          <div class="mon-head"><h2><span data-i18n="monitor.midi_out"></span> <button type="button" class="info" data-info="monitor.midi_out" aria-expanded="false">ⓘ</button></h2><span class="grow"></span>
            <button class="mini" data-act="pause" data-i18n="monitor.pause"></button>
            <button class="mini" data-act="clear" data-i18n="monitor.clear"></button>
            <button class="mini" data-act="csv" data-i18n="monitor.csv"></button>
            <button class="mini" data-act="full" data-i18n="monitor.full"></button>
          </div>
          <div class="mon-stats" id="mon-out-ports"></div>
          <div class="row wrap" id="mon-send">
            <select id="send-port" data-i18n-title="a11y.send_port"></select>
            <select id="send-type" data-i18n-title="a11y.send_type"><option value="note_on" data-i18n="monitor.t_note"></option><option value="control_change" data-i18n="monitor.t_cc"></option><option value="program_change" data-i18n="monitor.t_pc"></option></select>
            <input id="send-ch" class="mini num" type="number" min="1" max="16" value="1" data-i18n-title="monitor.f_channel">
            <input id="send-num" class="mini num" type="number" min="0" max="127" value="60" data-i18n-title="monitor.c_num">
            <input id="send-val" class="mini num" type="number" min="0" max="127" value="100" data-i18n-title="monitor.c_val">
            <button id="send-go" data-i18n="monitor.send"></button>
          </div>
          <div class="mon-body"><table class="mon-log"><thead><tr><th data-i18n="monitor.c_time"></th><th data-i18n="monitor.c_port"></th>
            <th data-i18n="monitor.c_ch"></th><th data-i18n="monitor.c_type"></th><th data-i18n="monitor.c_num"></th>
            <th data-i18n="monitor.c_val"></th><th data-i18n="monitor.c_action"></th></tr></thead>
            <tbody id="mon-out-log"></tbody></table></div>
        </div>
      </div>
    </section>

    <!-- LAYOUT -->
    <section id="page-layout" class="page wide">
      <div class="lp-head">
        <div class="tabs uni-tabs" id="lp-uni" role="tablist" data-i18n-title="layout.uni_tip"></div>
        <div class="lp-status" id="lp-status"></div><button type="button" class="info" data-info="layout.universes" aria-expanded="false">ⓘ</button>
        <span class="grow"></span>
        <div class="lp-actions">
          <span class="dirty-dot hidden" id="layout-dirty" data-i18n-title="layout.unsaved"></span>
          <button id="layout-save" class="primary" data-i18n="layout.save" data-key="Ctrl+S"></button>
          <button id="layout-undo" class="icon" data-icon="rotate-l" data-key="Ctrl+Z" data-tip="layout.undo"></button>
          <button id="layout-redo" class="icon" data-icon="rotate-r" data-key="Ctrl+Shift+Z" data-tip="layout.redo"></button>
          <button id="layout-reset" class="danger-text" data-i18n="layout.reset"></button>
          <button id="lp-print" data-i18n="layout.print" data-i18n-title="layout.print_tip"></button>
          <button id="lp-png" data-i18n="layout.png" data-i18n-title="layout.png_tip"></button>
        </div>
      </div>
      <div class="tabs" id="lp-views" role="tablist">
        <button data-view="stage" class="on" data-i18n="layout.view_stage"></button>
        <button data-view="addresses" data-i18n="layout.view_addresses"></button>
      </div>
      <div class="lp-body">
        <div class="lp-main">
          <div id="lp-stage" class="lp-pane">
      <div class="tabs" id="group-tabs" role="tablist"></div>
      <div class="toolbar">
        <div class="tools" role="group">
          <button data-tool="select" class="sel" data-i18n-title="layout.tool_select_tip"><span data-i18n="layout.tool_select"></span></button>
          <button data-tool="lasso" data-i18n-title="layout.tool_lasso_tip"><span data-i18n="layout.tool_lasso"></span></button>
          <button data-tool="move" data-i18n-title="layout.tool_move_tip"><span data-i18n="layout.tool_move"></span></button>
        </div>
        <label class="zoom"><span data-i18n="layout.zoom"></span><input type="range" id="zoom" min="50" max="400" step="10" value="100"></label>
        <button id="layout-fit" data-i18n="layout.fit" data-i18n-title="layout.fit_tip"></button>
        <label class="check"><input type="checkbox" id="show-names" checked><span data-i18n="layout.names"></span></label>
        <label class="check"><input type="checkbox" id="show-beams"><span data-i18n="layout.beams"></span></label>
      </div>
      <div class="stage-wrap">
      <div class="stage-over"><div class="grid-host edit" id="layout-grid"></div>
        <button type="button" class="info on-stage" data-info="layout.stage" aria-expanded="false">ⓘ</button></div>
      <div class="arrange" id="arrange" role="toolbar" aria-orientation="vertical">
        <div class="ar-group" data-group="align"><div class="ar-h"><span data-i18n="layout.g_align"></span> <button type="button" class="info" data-info="layout.arrange" aria-expanded="false">ⓘ</button></div>
          <div class="seg seg3">
            <button class="icon" data-align="left" data-icon="align-left" data-key="Alt+←" data-tip="layout.align_left"></button>
            <button class="icon" data-align="hcentre" data-icon="align-hcentre" data-tip="layout.align_hcentre"></button>
            <button class="icon" data-align="right" data-icon="align-right" data-key="Alt+→" data-tip="layout.align_right"></button>
            <button class="icon" data-align="top" data-icon="align-top" data-key="Alt+↑" data-tip="layout.align_top"></button>
            <button class="icon" data-align="vcentre" data-icon="align-vcentre" data-tip="layout.align_vcentre"></button>
            <button class="icon" data-align="bottom" data-icon="align-bottom" data-key="Alt+↓" data-tip="layout.align_bottom"></button>
          </div></div>
        <div class="ar-group" data-group="distribute"><div class="ar-h" data-i18n="layout.g_distribute"></div>
          <div class="seg seg3">
            <button class="icon" data-distribute="h" data-icon="distribute-h" data-tip="layout.distribute_h"></button>
            <button class="icon" data-distribute="v" data-icon="distribute-v" data-tip="layout.distribute_v"></button>
          </div></div>
        <div class="ar-group" data-group="shape"><div class="ar-h" data-i18n="layout.g_shape"></div>
          <div class="seg seg3">
            <button class="icon" data-make="row" data-icon="make-row" data-tip="layout.make_row"></button>
            <button class="icon" data-make="ring" data-icon="make-ring" data-tip="layout.make_ring"></button>
            <button class="icon" data-make="grid" data-icon="make-grid" data-tip="layout.make_grid"></button>

        <label class="button-like"><span data-i18n="palettes.import"></span><input type="file" id="palette-import" accept=".json,application/json" class="hidden-file"></label>
      </div>
      <div id="palette-list"></div>
      <h2><span data-i18n="palettes.named"></span> <button type="button" class="info" data-info="palettes.named" aria-expanded="false">ⓘ</button></h2>
      <div class="row wrap">
        <input id="colour-new-name" maxlength="40" data-i18n-placeholder="palettes.colour_placeholder">
        <button id="colour-new" data-i18n="palettes.new_colour"></button>
      </div>
      <ul class="named-colours" id="named-colours"></ul>
    </section>

    <!-- MIDI -->
    <section id="page-midi" class="page">
      <h2><span data-i18n="midi.inputs"></span> <button type="button" class="info" data-info="midi.inputs" aria-expanded="false">ⓘ</button></h2>
      <div class="row wrap">
        <input id="device-new-id" maxlength="40" data-i18n-placeholder="midi.device_placeholder">
        <button id="device-new" data-i18n="midi.add_device"></button>
        <select id="profile-pick" data-i18n-title="a11y.profile_pick"></select>
      </div>
      <div id="input-edit"></div>
      <div id="inputs"></div>
      <h2><span data-i18n="kit.title"></span> <button type="button" class="info" data-info="kit" aria-expanded="false">ⓘ</button></h2>
      <div class="row wrap">
        <select id="kit-pick" data-i18n-title="kit.active"></select>
        <span id="kit-chan" class="muted"></span>
        <button id="kit-new" class="mini" data-i18n="kit.new_gm"></button>
        <button id="kit-export" class="mini" data-i18n="kit.export"></button>
        <button id="kit-import" class="mini" data-i18n="kit.import"></button>
        <span id="kit-note" class="muted"></span>
      </div>
      <div id="kit-learning" class="mon-flag hidden"></div>
      <div class="table-scroll"><table class="grid-table kit-table">
        <thead><tr><th data-i18n="kit.piece"></th><th data-i18n="kit.zone"></th><th data-i18n="kit.notes"></th><th data-i18n="kit.role"></th>
          <th data-i18n="kit.weight"></th><th data-i18n="kit.floor"></th><th data-i18n="kit.tempo"></th><th data-i18n="kit.flash"></th>
          <th data-i18n="kit.trigger"></th><th></th></tr></thead>
        <tbody id="kit-rows"></tbody></table></div>
      <div class="row wrap"><input id="kit-add-piece" maxlength="40" data-i18n-placeholder="kit.add_placeholder">
        <input id="kit-add-zone" maxlength="40" value="head" data-i18n-title="kit.zone">
        <button id="kit-add" class="mini" data-i18n="kit.add"></button></div>
      <div id="kit-unmapped" class="mon-flag hidden"></div>
      <h2><span data-i18n="midi.monitor"></span> <button type="button" class="info" data-info="midi.monitor" aria-expanded="false">ⓘ</button></h2>
      <div class="row wrap">
        <button id="midi-pause" data-i18n="midi.pause"></button>
        <button id="midi-clear" data-i18n="midi.clear"></button>
        <select id="midi-filter" data-i18n-title="a11y.midi_filter"></select>
      </div>
      <table class="monitor"><thead><tr>
        <th data-i18n="midi.col_time"></th><th data-i18n="midi.col_port"></th><th data-i18n="midi.col_ch"></th>
        <th data-i18n="midi.col_type"></th><th>#</th><th data-i18n="midi.col_value"></th><th data-i18n="midi.col_named"></th><th data-i18n="midi.col_triggered"></th>
      </tr></thead><tbody id="monitor"></tbody></table>
      <h2><span data-i18n="midi.learn"></span> <button type="button" class="info" data-info="midi.learn" aria-expanded="false">ⓘ</button></h2>
      <div class="row wrap">
        <select id="learn-action" data-i18n-title="a11y.learn_action"></select>
        <input id="learn-params" data-i18n-placeholder="midi.params_placeholder">
        <button id="learn-go" data-i18n="midi.learn_go"></button>
        <button id="learn-cancel" data-i18n="midi.learn_cancel"></button>
        <span id="learn-state" class="muted"></span>
      </div>
      <details class="section" id="map-section" data-remember="midi.map">
        <summary><span data-i18n="midi.mapping"></span> <button type="button" class="info" data-info="midi.mapping" aria-expanded="false">ⓘ</button><span class="sum muted" data-i18n="midi.mapping_sum"></span></summary>
        <table class="map"><thead><tr>
          <th data-i18n="midi.col_input"></th><th data-i18n="midi.col_message"></th><th>#</th><th data-i18n="midi.col_action"></th><th></th>
        </tr></thead><tbody id="map"></tbody></table>
        <button id="map-save" data-i18n="midi.save"></button>
      </details>
    </section>

    <!-- SETUP -->
    <section id="page-setup" class="page">
      <h2><span data-i18n="setup.find"></span> <button type="button" class="info" data-info="setup.find" aria-expanded="false">ⓘ</button></h2>
      <div class="row wrap" id="find"></div>
      <h2><span data-i18n="setup.channel_tester"></span> <button type="button" class="info" data-info="setup.tester" aria-expanded="false">ⓘ</button></h2>
      <div class="row wrap">
        <input id="chanuni" type="number" min="0" max="15" value="0" class="narrow" data-i18n-title="setup.universe">
        <input id="chan" type="number" min="1" max="512" class="narrow" data-i18n-placeholder="setup.channel">
        <input id="chanval" type="range" min="0" max="255" value="0" data-i18n-title="a11y.chanval">
        <span id="chanshow">0</span>
        <button id="chan-off" data-i18n="setup.release"></button>
        <button data-cmd="setup_off" data-i18n="setup.clear_tests"></button>
      </div>
      <h2 data-i18n="setup.flash_test"></h2>
      <div class="row"><button data-cmd="flash_test" data-i18n="setup.flash_all"></button></div>
      <div class="pair">
        <div>
          <h2 data-i18n="setup.devices"></h2>
          <table class="devices"><thead><tr>
            <th data-i18n="setup.col_device"></th><th data-i18n="setup.col_type"></th><th data-i18n="setup.col_state"></th><th data-i18n="setup.col_detail"></th>
          </tr></thead><tbody id="devices"></tbody></table>
        </div>
        <div>
          <h2><span data-i18n="setup.found"></span> <button type="button" class="info" data-info="setup.found" aria-expanded="false">ⓘ</button></h2>
          <table class="devices"><thead><tr>
            <th data-i18n="setup.col_device"></th><th data-i18n="setup.col_id"></th><th data-i18n="setup.col_alias"></th>
            <th data-i18n="setup.col_use"></th><th></th>
          </tr></thead><tbody id="found"></tbody></table>
          <ul class="layout-problems" id="found-missing"></ul>
        </div>
        <div>
          <h2><span data-i18n="setup.nodes"></span> <button type="button" class="info" data-info="setup.nodes" aria-expanded="false">ⓘ</button></h2>
          <table class="nodes"><thead><tr>
            <th data-i18n="setup.col_name"></th><th>MAC</th><th data-i18n="setup.col_state"></th><th data-i18n="setup.col_signal"></th>
            <th data-i18n="setup.col_loss"></th><th data-i18n="setup.col_last_data"></th><th></th>
          </tr></thead><tbody id="nodes"></tbody></table>
          <div class="row wrap">
            <span class="muted" id="node-setup"></span>
            <button id="node-resend" data-i18n="setup.node_resend" data-i18n-title="setup.node_resend_tip"></button>
            <label class="field-inline"><span data-i18n="setup.radio_channel"></span>
              <input type="number" id="radio-channel" min="1" max="13" class="num"></label>
            <button id="radio-move" data-i18n="setup.radio_move"></button>
          </div>
        </div>
      </div>
      <details class="section" id="addr-section" data-remember="setup.addr">
        <summary><span data-i18n="setup.addresses"></span><span class="sum muted" id="addrnotes"></span></summary>
        <table class="addr"><thead><tr>
          <th data-i18n="setup.col_fixture"></th><th data-i18n="setup.col_type"></th><th data-i18n="setup.col_uni"></th>
          <th data-i18n="setup.col_start"></th><th data-i18n="setup.col_end"></th><th data-i18n="setup.col_in_rig"></th><th data-i18n="setup.col_checked"></th>
        </tr></thead><tbody id="addr"></tbody></table>
      </details>
      <h2><span data-i18n="access.title"></span> <button type="button" class="info" data-info="setup.access" aria-expanded="false">ⓘ</button></h2>
      <div class="access" id="access">
        <p class="muted" id="access-state"></p>
        <div class="row wrap">
          <input type="password" id="pin-old" autocomplete="current-password" data-i18n-placeholder="access.pin_old">
          <input type="password" id="pin-new" autocomplete="new-password" data-i18n-placeholder="access.pin_new">
          <button id="pin-set" data-i18n="access.pin_set"></button>
          <button id="pin-clear" class="danger-text" data-i18n="access.pin_clear"></button>
        </div>
        <div class="row wrap">
          <label class="check"><input type="checkbox" id="access-lan"><span data-i18n="access.lan"></span></label>
          <label class="check"><input type="checkbox" id="access-local"><span data-i18n="access.pin_local"></span></label>
          <label class="field-inline"><span data-i18n="access.session_hours"></span>
            <input type="number" id="access-hours" min="0.25" max="168" step="0.25" class="num"></label>
        </div>
        <div class="lan-info hidden" id="lan-info">
          <div class="qr" id="lan-qr"></div>
          <div><p data-i18n="access.lan_help"></p><ul class="urls" id="lan-urls"></ul></div>
        </div>
        <button id="logout" class="hidden" data-i18n="access.logout"></button>
      </div>
      <details class="section" id="claude-section">
        <summary><span data-i18n="claude.title"></span> <button type="button" class="info" data-info="setup.claude" aria-expanded="false">ⓘ</button><span class="sum muted" id="claude-sum"></span></summary>
        <div id="claude-connect" class="claude-connect"></div>
      </details>
      <h2><span data-i18n="setup.appearance"></span> <button type="button" class="info" data-info="setup.appearance" aria-expanded="false">ⓘ</button></h2>
      <div class="row wrap">
        <label class="muted" for="theme" data-i18n="setup.theme"></label>
        <select id="theme"></select>
        <label class="muted" for="density" data-i18n="setup.density"></label>
        <select id="density"><option value="compact" data-i18n="setup.density_compact"></option><option value="comfortable" data-i18n="setup.density_comfortable"></option></select>
        <label class="muted" for="motion" data-i18n="setup.motion"></label>
        <select id="motion"><option value="auto" data-i18n="setup.motion_auto"></option><option value="reduce" data-i18n="setup.motion_reduce"></option><option value="full" data-i18n="setup.motion_full"></option></select>
      </div>
      <h2 data-i18n="setup.updates"></h2>
      <div class="row wrap">
        <button id="update-check" data-i18n="setup.update_check"></button>
        <span class="muted" id="update-result"></span>
      </div>
      <h2 data-i18n="wizard.title"></h2>
      <div class="row wrap"><button id="wizard-open" data-i18n="wizard.open"></button><span class="muted" data-i18n="wizard.open_help"></span></div>
    </section>

    <!-- FIXTURES -->
    <section id="page-fixtures" class="page">
      <div class="tabs" id="fx-tabs" role="tablist">
        <button data-tab="patch" class="on" data-i18n="fixtures.tab_patch"></button>
        <button data-tab="types" data-i18n="fixtures.tab_types"></button>
        <button data-tab="rig" data-i18n="fixtures.tab_rig"></button>
        <span class="muted" id="fx-state"></span>
      </div>
      <div id="fx-tab-patch">
        <table class="grid-table">
          <thead><tr><th data-i18n="fixtures.col_id"></th><th data-i18n="fixtures.col_type"></th><th data-i18n="fixtures.col_universe"></th>
            <th data-i18n="fixtures.col_address"></th><th data-i18n="fixtures.col_channels"></th><th data-i18n="fixtures.col_groups"></th>
            <th data-i18n="fixtures.col_sub"></th><th></th></tr></thead>
          <tbody id="fx-patch"></tbody>
        </table>
        <div class="error" id="fx-clash" role="alert"></div>
        <div class="row wrap">
          <select id="fx-add-type" data-i18n-title="a11y.fx_add_type"></select>
          <input id="fx-add-count" type="number" min="1" max="64" value="1" class="num" data-i18n-title="fixtures.add_count">
          <input id="fx-add-id" class="narrow" data-i18n-placeholder="fixtures.add_id">
          <button id="fx-add" data-i18n="fixtures.add"></button>
          <button id="fx-auto" data-i18n="fixtures.auto_patch" data-i18n-title="fixtures.auto_patch_tip"></button>
          <button id="fx-patch-save" data-i18n="fixtures.save_patch"></button>
          <button type="button" class="info" data-info="fixtures.patch" aria-expanded="false">ⓘ</button>
        </div>
      </div>
      <div id="fx-tab-types" class="hidden">
        <div class="row wrap">
          <select id="fx-type-pick"></select>
          <button id="fx-type-new" data-i18n="fixtures.new_type"></button>
          <label class="button"><span data-i18n="fixtures.import_ofl"></span><input type="file" id="fx-ofl" accept=".json" class="hidden"></label>
          <button id="fx-ofl-export" data-i18n="fixtures.export_ofl"></button>
          <button id="fx-type-del" class="danger-text" data-i18n="fixtures.delete_type"></button>
          <button id="fx-type-save" data-i18n="fixtures.save_type"></button>
        </div>
        <div id="fx-type"></div>
      </div>
      <div id="fx-tab-rig" class="hidden">
        <div class="row wrap">
          <select id="fx-rig-pick"></select>
          <button id="fx-rig-use" data-i18n="fixtures.use_rig"></button>
          <button id="fx-rig-save" data-i18n="fixtures.save_rig"></button>
          <span class="muted" id="fx-rig-state"></span><button type="button" class="info" data-info="fixtures.rig" aria-expanded="false">ⓘ</button>
        </div>
        <div id="fx-rig"></div>
      </div>
    </section>

    <!-- FILES -->
    <section id="page-files" class="page">
      <h2><span data-i18n="project.title"></span> <button type="button" class="info" data-info="files.project" aria-expanded="false">ⓘ</button></h2>
      <p id="project-now"></p>
      <div class="row wrap">
        <button id="project-open" data-i18n="project.open"></button>
        <button id="project-save-as" data-i18n="project.save_as"></button>
        <button id="project-new" data-i18n="project.new"></button>
        <a id="project-download" class="button" href="/api/project/download" data-i18n="project.download"></a>
        <label class="button"><span data-i18n="project.upload"></span><input type="file" id="project-upload" accept=".dms" class="hidden"></label>
      </div>
      <div class="row wrap hidden" id="project-path-row">
        <input id="project-path" class="wide" data-i18n-placeholder="project.path_placeholder">
        <button id="project-path-go" data-i18n="project.go"></button>
        <button id="project-path-cancel" data-i18n="project.cancel"></button>
      </div>
      <h3 data-i18n="project.recent"></h3>
      <ul class="recent" id="project-recent"></ul>
      <h2 data-i18n="files.scenes"></h2>
      <div class="list" id="scenes"></div>
      <h2><span data-i18n="history.title"></span> <button type="button" class="info" data-info="files.history" aria-expanded="false">ⓘ</button></h2>
      <div class="row wrap">
        <button id="undo" data-i18n="history.undo"></button>
        <button id="redo" data-i18n="history.redo"></button>
      </div>
      <ol class="history" id="history"></ol>
      <h2><span data-i18n="files.backups"></span> <button type="button" class="info" data-info="files.backups" aria-expanded="false">ⓘ</button></h2>
      <div class="list" id="backups"></div>
    </section>
  </main>
</div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<dialog id="wizard" class="wizard-dialog"></dialog>
<div class="offline-box" id="offline" role="alert"><strong data-i18n="status.lost_title"></strong><span data-i18n="status.lost_help"></span></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
