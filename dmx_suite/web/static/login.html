<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-name" content="dmx-suite">
<meta name="theme-color" content="#08080b">
<title>__APP_NAME__</title>
<link rel="icon" href="/static/brand/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/themes/__THEME__/theme.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
<form class="login" id="login">
  <img src="/static/themes/__THEME__/logo.svg" alt="" class="logo">
  <h1 data-i18n="login.title"></h1>
  <p class="muted" data-i18n="login.help"></p>
  <input type="password" id="pin" autocomplete="current-password" inputmode="numeric" data-i18n-placeholder="login.pin" required>
  <button type="submit" data-i18n="login.sign_in"></button>
  <p class="err" id="login-error" role="alert"></p>
</form>
<script type="module" src="/static/js/login.js"></script>
</body>
</html>
