; 0.05 DMX Suite node firmware
;   pio run -e node        CoreS3 SE + Unit DMX (USB serial -> DMX + ESP-NOW)
;   pio run -e receiver    AtomS3 Lite + Unit DMX (ESP-NOW -> DMX)
; Set the band key for real builds:
;   PLATFORMIO_BUILD_FLAGS='-DPAIRING_KEY=\"your-band-key\"' pio run

[platformio]
default_envs = node, receiver

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = someweisguy/esp_dmx@4.1.0
build_flags =
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:node]
board = m5stack-cores3
build_src_filter = +<node/>
build_flags = ${env.build_flags} -DNODE_BUILD

[env:receiver]
board = m5stack-atoms3
build_src_filter = +<receiver/>
build_flags = ${env.build_flags} -DRECEIVER_BUILD
