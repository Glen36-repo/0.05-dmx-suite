[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmx-suite"
version = "0.1.0"
description = "0.05 DMX Suite: live lighting for the band 0.05"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dmx-node-test = "dmx_suite.tools.node_test:main"

[tool.setuptools.packages.find]
include = ["dmx_suite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
