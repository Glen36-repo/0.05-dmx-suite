[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmx-suite"
version = "0.1.0"
description = "0.05 DMX Suite: live lighting for the band 0.05"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5", "mido>=1.3", "PyYAML>=6"]

[project.optional-dependencies]
# real MIDI ports (gig laptop); prebuilt wheels on Windows, needs ALSA/JACK headers on Linux
hw = ["python-rtmidi>=1.5"]
claude = ["mcp>=2.3"]
dev = ["pytest>=8"]

[project.scripts]
dmx-suite = "dmx_suite.cli:main"
dmx-node-test = "dmx_suite.tools.node_test:main"

[tool.setuptools.packages.find]
include = ["dmx_suite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
