# MIDI map: what each named input (inputs.yaml) does. Notes and program numbers live in
# inputs.yaml, so a changed pedal or pad is fixed there once.
# Drum pads: which pads flash which fixtures is still open (SCOPE). Use MIDI learn to fill these in.
version: 5
name: Default
mappings:
  # FCB1010, ch 1
  - {input: master, action: master_toggle}
  - {input: blackout, action: blackout_toggle}
  - {input: haze_manual, action: haze_manual}
  - {input: haze_pulse, action: haze_pulse}
  - {input: haze_off, action: haze_off}
  - {input: haze_boost, action: haze_boost}       # momentary switch: held = boost
  - {input: expression, action: grand_master}     # expression pedal

  # TD-25, ch 10 (GM drum notes)
  - {input: snare, action: flash, fixtures: [bars], length_ms: 120, colour: show}
  - {input: snare_rim, action: flash, fixtures: [bars], length_ms: 120, colour: show}
  - {input: tom_1, action: flash, fixtures: [bar_1, bar_2], length_ms: 150, colour: show}
  - {input: tom_3, action: flash, fixtures: [bar_3, bar_4], length_ms: 150, colour: show}
  - {input: crash, action: flash, fixtures: [all], length_ms: 250, colour: white}
  - {input: ride, action: flash, fixtures: [washes], length_ms: 200, colour: show}

  # Shows and setlist (FCB1010, ch 1). PLACEHOLDER program numbers.
  - {input: set_low, action: select_set, set: low}
  - {input: set_mid, action: select_set, set: mid}
  - {input: set_high, action: select_set, set: high}
  - {input: show_opera, action: select_show, show: opera}
  - {input: show_acoustic, action: select_show, show: acoustic}
  - {input: next_song, action: next_song}
  - {input: prev_song, action: prev_song}
  - {input: next_step, action: next_step}
  - {input: tap, action: tap_tempo}

  # SamplePad 4 (phase 2): add its pads to inputs.yaml (device samplepad), then map them here, e.g.
  # - {input: pad_1, action: flash, fixtures: [movers], length_ms: 150, colour: white}
