# Full rig. Levels are 0-100 %. Head limits are % of the pan/tilt range.
version: 4
name: Full rig
fixtures: [all]

# Rule profile: 0.05_band (MASTER on/off, drum flash, kick light ignores MASTER) or generic
profile: 0.05_band

grand_master: 100
sub_masters: {head: 100, bar: 100, wash: 100, kick: 100}
flash_level: 100          # drum flash level, on top of the grand master
fade_s: 0.3               # grand/sub-master fade time across the full range

kick_colour: {red: 100, green: 100, blue: 100}   # when the look doesn't set the kick light

head_limits:
  mh_a: {pan: [0, 100], tilt: [0, 75]}     # MH-A tilt limit: PLACEHOLDER, set at rehearsal
  mh_b: {pan: [0, 100], tilt: [0, 100]}

haze:
  enabled: true
  default_mode: "off"     # off | manual | pulse (quoted: bare off reads as false)
  level: 60
  boost_level: 100
  pulse_on_s: 5
  pulse_every_s: 120
  boost_s: 0              # 0 = while the footswitch is held
  max_on_s: 60
  rest_s: 30
  boost_cooldown_s: 20
  auto_off_min: 120

startup:
  master: on              # state after a (re)start mid-gig

# MIDI inputs to open (parts of the port names); leave out to open every port.
# PLACEHOLDER names: check with `dmx-suite midi-ports` on the gig laptop.
midi_inputs: [UM-ONE]          # phase 2: add H2MIDI for the SamplePad

nodes: []                 # expected nodes, e.g. {mac: "F4:12:FA:00:A0:01", name: Left bars}

outputs:
  - {driver: enttec_open, port: COM3}     # PLACEHOLDER port; node_serial once the node is built
