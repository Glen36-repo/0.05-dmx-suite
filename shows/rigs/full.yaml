# Full rig. Levels are 0-100 %. Head limits are % of the pan/tilt range.
version: 5
name: Full rig
fixtures: [all]

# Rule profile: 0.05_band (MASTER on/off, drum flash, kick light ignores MASTER) or generic
profile: 0.05_band

grand_master: 100
sub_masters: {head: 100, bar: 100, wash: 100, kick: 100}
flash_level: 100          # drum flash level, on top of the grand master
fade_s: 0.3               # grand/sub-master fade time across the full range

kick_colour: {red: 100, green: 100, blue: 100}   # when the look doesn't set the kick light

head_limits:
  mh_a: {pan: [0, 100], tilt: [0, 75]}     # MH-A tilt limit: PLACEHOLDER, set at rehearsal
  mh_b: {pan: [0, 100], tilt: [0, 100]}

haze:
  enabled: true
  default_mode: "off"     # off | manual | pulse (quoted: bare off reads as false)
  level: 60
  boost_level: 100
  pulse_on_s: 5
  pulse_every_s: 120
  boost_s: 0              # 0 = while the footswitch is held
  max_on_s: 60
  rest_s: 30
  boost_cooldown_s: 20
  auto_off_min: 120

startup:
  master: on              # state after a (re)start mid-gig

# MIDI inputs to open (parts of the port names); leave out to open every port.
# PLACEHOLDER names: check with `dmx-suite midi-ports` on the gig laptop.
midi_inputs: [UM-ONE]          # phase 2: add H2MIDI for the SamplePad

nodes: []                 # expected nodes, e.g. {mac: "F4:12:FA:00:A0:01", name: Left bars}

outputs:
  - {driver: enttec_open, port: COM3}     # PLACEHOLDER port; node_serial once the node is built

# Head position points (v3): where each head aims to hit the same spot, 0-1 of its pan/tilt range.
# Scenes, busk buttons and the auto show use the names. PLACEHOLDERS until focused at rehearsal
# (Heads page: aim, then store to the point).
positions:
  drum_kit:
    description: Drum kit, centre back, cymbal height
    tags: [band, safe]
    stage: {x: centre, y: back, z: mid}
    heads:
      mh_a: {pan: 0.42, tilt: 0.3}
      mh_b: {pan: 0.58, tilt: 0.3}
  centre:
    description: Centre stage, floor
    tags: [band, safe, floor]
    stage: {x: centre, y: middle, z: floor}
    heads:
      mh_a: {pan: 0.5, tilt: 0.5}
      mh_b: {pan: 0.5, tilt: 0.5}
  audience_l:
    description: Audience left, above head height
    tags: [audience]
    stage: {x: left, y: front, z: high}
    heads:
      mh_a: {pan: 0.3, tilt: 0.55}
      mh_b: {pan: 0.3, tilt: 0.55}
  audience_r:
    description: Audience right, above head height
    tags: [audience]
    stage: {x: right, y: front, z: high}
    heads:
      mh_a: {pan: 0.7, tilt: 0.55}
      mh_b: {pan: 0.7, tilt: 0.55}
  ceiling:
    description: Straight up at the ceiling
    tags: [ceiling, safe]
    stage: {x: centre, y: middle, z: ceiling}
    heads:
      mh_a: {pan: 0.5, tilt: 0.95}
      mh_b: {pan: 0.5, tilt: 0.95}
